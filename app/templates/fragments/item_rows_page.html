{% for item in items %}
{% include "fragments/item_row.html" %}
{% endfor %}
{% if has_more is defined and has_more %}
<tr id="load-more"
    hx-get="{{ load_more_url }}" hx-trigger="revealed" hx-swap="outerHTML" hx-include="[name='view']">
    <td colspan="{{ browse_columns|length }}" class="relative h-14">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-6 h-6 border-2 border-shelf-border border-t-shelf-accent rounded-full animate-spin"></div>
        </div>
    </td>
</tr>
{% endif %}
